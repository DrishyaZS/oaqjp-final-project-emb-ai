<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Emotion Detector</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 50px auto; padding: 20px; }
        textarea { width: 100%; height: 100px; margin: 10px 0; padding: 8px; }
        button { background: #0062ff; color: white; padding: 10px 24px; border: none; cursor: pointer; border-radius: 4px; }
        #result { margin-top: 20px; padding: 15px; background: #f4f4f4; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Emotion Detector</h1>
    <p>Enter text below to analyze its emotional content:</p>
    <textarea id="textInput" placeholder="Type your text here..."></textarea><br>
    <button onclick="analyzeEmotion()">Analyze Emotion</button>
    <div id="result"></div>
    <script>
        function analyzeEmotion() {
            const text = document.getElementById('textInput').value;
            fetch('/emotionDetector?textToAnalyze=' + encodeURIComponent(text))
                .then(response => response.text())
                .then(data => {
                    document.getElementById('result').innerHTML = '<strong>Result:</strong> ' + data;
                });
        }
    </script>
</body>
</html>
